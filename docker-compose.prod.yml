# Production compose file for this app on the VPS.
# This file itself is NOT built by CI — it's placed on the server once (by hand or by the
# deploy step) and just gets `docker compose pull && docker compose up -d` run against it.
#
# IMAGE is injected as an env var by the deploy step so it always points at the exact
# tag GitHub Actions just built (e.g. ghcr.io/truetwist-organization/duvo-clone:sha-abc123).

services:
  app:
    image: ${IMAGE}
    container_name: duvo-app
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      # Only expose to localhost; a reverse proxy (Caddy/nginx) in front handles the
      # public domain + TLS and forwards to these. Change to "3000:3000" / "4000:4000"
      # only if this container is the sole thing on the box and you're fine exposing
      # the ports directly.
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: duvo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-duvo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-duvo}
    volumes:
      - duvo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-duvo} -d ${POSTGRES_DB:-duvo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  duvo_pg_data:
